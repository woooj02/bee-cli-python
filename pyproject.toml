[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bee-cli-python"
version = "0.1.0"
description = "Python client for Bee (bee.computer): every bee CLI command, typed live events, and a fake Bee for tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "woooj02" }]
keywords = ["bee", "wearable", "bee.computer", "transcripts", "cli", "sse"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/woooj02/bee-cli-python"
"Bee CLI" = "https://github.com/bee-computer/bee-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/beecli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
